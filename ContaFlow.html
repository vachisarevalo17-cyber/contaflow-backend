<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1D4ED8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ContaFlow">
  <title>ContaFlow — Del XML a la póliza</title>
  <style>
    :root{
      --bg:#05080F; --s1:#0B1221; --s2:#101A2E; --s3:#182238;
      --b1:rgba(255,255,255,0.05); --b2:rgba(255,255,255,0.09);
      --blue:#3B82F6; --blue-d:#2563EB; --cyan:#22D3EE;
      --green:#4ADE80; --amber:#FBB040; --red:#F87171; --purple:#A78BFA;
      --t1:#F0F4FF; --t2:#8BA3C7; --t3:#3D5478;
      --r1:10px; --r2:16px; --r3:22px;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{background:var(--bg);color:var(--t1);min-height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      font-size:14px;overflow-x:hidden}

    /* SPLASH */
    #splash{position:fixed;inset:0;z-index:9999;
      background:radial-gradient(ellipse 80% 60% at 50% 0%,#0D1F45 0%,var(--bg) 70%);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      transition:opacity .6s ease}
    .sp-logo{position:relative;display:flex;align-items:center;justify-content:center;
      width:120px;height:120px}
    .sp-logo img,.sp-logo svg{width:90px;height:90px;border-radius:22px;
      box-shadow:0 0 60px rgba(34,211,238,.3);
      animation:popIn .7s cubic-bezier(.34,1.56,.64,1) forwards}
    .sp-ring{position:absolute;border-radius:50%;border:1px solid;animation:ringPulse 3s ease-in-out infinite}
    .sp-ring:nth-child(1){inset:-15px;border-color:rgba(34,211,238,.2);animation-delay:0s}
    .sp-ring:nth-child(2){inset:-32px;border-color:rgba(34,211,238,.1);animation-delay:.5s}
    .sp-ring:nth-child(3){inset:-50px;border-color:rgba(34,211,238,.05);animation-delay:1s}
    @keyframes ringPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.05);opacity:.4}}
    @keyframes popIn{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
    .sp-title{margin-top:24px;font-size:36px;font-weight:900;letter-spacing:-1.5px;
      background:linear-gradient(135deg,#fff 40%,var(--cyan));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
      animation:fadeUp .5s .3s both}
    .sp-sub{font-size:11px;color:var(--t3);letter-spacing:2px;text-transform:uppercase;
      margin-top:6px;animation:fadeUp .5s .5s both}
    .sp-bar{width:80px;height:2px;background:var(--s3);border-radius:2px;
      margin-top:48px;overflow:hidden;animation:fadeUp .5s .7s both}
    .sp-bar-fill{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--cyan));
      border-radius:2px;animation:barLoad 1.8s .8s ease forwards}
    @keyframes barLoad{to{width:100%}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}

    /* HEADER */
    #app-header{
      background:rgba(5,8,15,.9);
      backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
      border-bottom:1px solid var(--b1);
      padding:0 16px;height:58px;
      position:sticky;top:0;z-index:10;
      display:flex;justify-content:space-between;align-items:center;
    }
    .hdr-brand{display:flex;align-items:center;gap:10px}
    .hdr-logo{width:34px;height:34px;border-radius:10px;flex-shrink:0}
    .hdr-name{font-size:18px;font-weight:900;letter-spacing:-.8px;
      background:linear-gradient(120deg,#fff,var(--cyan));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .hdr-emp{font-size:9px;color:var(--t3);margin-top:1px;letter-spacing:.3px}
    .hdr-right{display:flex;align-items:center;gap:8px}
    .hdr-badge{background:rgba(34,211,238,.12);color:var(--cyan);
      font-size:9px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.5px}
    .hdr-count{text-align:right}
    .hdr-num{font-size:15px;font-weight:800;color:var(--cyan);line-height:1}
    .hdr-label{font-size:8px;color:var(--t3);margin-top:1px}

    /* NAV */
    #app-nav{
      position:fixed;bottom:0;left:0;right:0;z-index:10;
      background:rgba(5,8,15,.97);
      backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
      border-top:1px solid var(--b1);
      display:flex;align-items:stretch;
      padding-bottom:env(safe-area-inset-bottom);
    }
    .nb{flex:1;background:none;border:none;padding:8px 0 10px;
      display:flex;flex-direction:column;align-items:center;gap:3px;
      cursor:pointer;font-family:inherit;position:relative;transition:.15s}
    .nb:active{opacity:.7}
    .nb-ic{font-size:20px;line-height:1;transition:transform .2s}
    .nb-lb{font-size:9px;font-weight:600;transition:color .2s}
    .nb.active .nb-ic{transform:scale(1.2)}
    .nb.active .nb-lb{color:var(--cyan)}
    .nb:not(.active) .nb-lb{color:var(--t3)}
    .nb-bar{position:absolute;top:0;left:25%;right:25%;height:2px;
      background:var(--cyan);border-radius:0 0 3px 3px;
      box-shadow:0 0 10px var(--cyan);
      transition:opacity .2s}
    .nb.active .nb-bar{opacity:1}
    .nb:not(.active) .nb-bar{opacity:0}

    /* MAIN */
    main{padding:16px 16px 100px;animation:fadeIn .2s ease}

    /* CARDS */
    .card{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r2);padding:14px;margin-bottom:10px}
    .card-glow{border-color:rgba(34,211,238,.15);box-shadow:0 0 24px rgba(34,211,238,.05)}

    /* KPI GRID */
    .kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
    .kpi{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r2);
      padding:14px 12px;position:relative;overflow:hidden}
    .kpi::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:currentColor;opacity:.5}
    .kpi-val{font-size:24px;font-weight:900;line-height:1;margin-top:6px;letter-spacing:-.5px}
    .kpi-label{font-size:10px;color:var(--t2);font-weight:500}
    .kpi-icon{font-size:18px;margin-bottom:2px}

    /* ── BUTTONS 3D ────────────────────────────────────────────────────────── */
    .btn{
      border:none;border-radius:14px;padding:14px 16px;
      font-size:13px;font-weight:700;cursor:pointer;width:100%;display:block;
      font-family:inherit;letter-spacing:.2px;position:relative;overflow:hidden;
      transition:transform .12s, box-shadow .12s;
      -webkit-appearance:none;
    }
    /* Shine overlay */
    .btn::before{
      content:'';position:absolute;top:0;left:0;right:0;height:45%;
      background:linear-gradient(180deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,0) 100%);
      border-radius:14px 14px 0 0;pointer-events:none;
    }
    /* Press effect */
    .btn:active{transform:translateY(2px) scale(.99);}

    /* PRIMARY — Blue 3D */
    .btn-p,.btn-primary{
      background:linear-gradient(180deg,#4D8EF8 0%,#1D4ED8 100%);
      color:#fff;
      border-top:1px solid rgba(255,255,255,.2);
      box-shadow:
        0 1px 0 rgba(255,255,255,.15) inset,
        0 -1px 0 rgba(0,0,0,.25) inset,
        0 6px 20px rgba(37,99,235,.5),
        0 2px 4px rgba(0,0,0,.3);
    }
    .btn-p:active,.btn-primary:active{
      box-shadow:0 2px 8px rgba(37,99,235,.4),0 1px 2px rgba(0,0,0,.3);
    }

    /* CYAN — Accent 3D */
    .btn-c{
      background:linear-gradient(180deg,#38D9EF 0%,#0891B2 100%);
      color:#fff;
      border-top:1px solid rgba(255,255,255,.25);
      box-shadow:
        0 1px 0 rgba(255,255,255,.2) inset,
        0 -1px 0 rgba(0,0,0,.2) inset,
        0 6px 24px rgba(34,211,238,.45),
        0 2px 4px rgba(0,0,0,.3);
    }
    .btn-c:active{box-shadow:0 2px 10px rgba(34,211,238,.4),0 1px 2px rgba(0,0,0,.2);}

    /* SUCCESS — Green 3D */
    .btn-g,.btn-success{
      background:linear-gradient(180deg,#4CE082 0%,#16A34A 100%);
      color:#fff;
      border-top:1px solid rgba(255,255,255,.2);
      box-shadow:
        0 1px 0 rgba(255,255,255,.18) inset,
        0 -1px 0 rgba(0,0,0,.2) inset,
        0 6px 20px rgba(74,222,128,.4),
        0 2px 4px rgba(0,0,0,.25);
    }
    .btn-g:active,.btn-success:active{box-shadow:0 2px 8px rgba(74,222,128,.35);}

    /* SECONDARY — Glass 3D */
    .btn-s,.btn-secondary{
      background:linear-gradient(180deg,rgba(255,255,255,.08) 0%,rgba(255,255,255,.02) 100%);
      color:var(--t2);
      border:1px solid rgba(255,255,255,.1);
      border-top-color:rgba(255,255,255,.14);
      box-shadow:
        0 1px 0 rgba(255,255,255,.06) inset,
        0 2px 8px rgba(0,0,0,.3);
    }
    .btn-s:active,.btn-secondary:active{box-shadow:0 1px 3px rgba(0,0,0,.2);}

    /* DANGER — Red 3D */
    .btn-r,.btn-danger{
      background:linear-gradient(180deg,rgba(248,113,113,.2) 0%,rgba(127,29,29,.3) 100%);
      color:var(--red);font-size:11px;
      border:1px solid rgba(248,113,113,.2);
      border-top-color:rgba(248,113,113,.25);
      box-shadow:0 2px 8px rgba(127,29,29,.3);
    }
    .btn-r:active,.btn-danger:active{box-shadow:0 1px 3px rgba(127,29,29,.2);}

    /* PURPLE — Special */
    .btn-purple{
      background:linear-gradient(180deg,#9F7AEA 0%,#6D28D9 100%);
      color:#fff;
      border-top:1px solid rgba(255,255,255,.2);
      box-shadow:
        0 1px 0 rgba(255,255,255,.15) inset,
        0 6px 20px rgba(109,40,217,.45),
        0 2px 4px rgba(0,0,0,.3);
    }
    .btn-purple:active{box-shadow:0 2px 8px rgba(109,40,217,.4);}

    /* INPUTS */
    input,select,textarea{
      width:100%;background:var(--s1);border:1px solid var(--b2);border-radius:var(--r1);
      padding:11px 13px;font-size:13px;color:var(--t1);outline:none;
      font-family:inherit;-webkit-appearance:none;transition:border-color .2s,box-shadow .2s}
    input:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.08)}
    label{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--t2);cursor:pointer}
    input[type=checkbox]{width:16px;height:16px;accent-color:var(--cyan)}

    /* TABLES */
    table{width:100%;border-collapse:collapse;font-size:10px}
    th{padding:7px 5px;text-align:left;color:var(--t3);font-weight:600;
      border-bottom:1px solid var(--b1);font-size:9px;letter-spacing:.3px}
    td{padding:8px 5px;border-bottom:1px solid rgba(255,255,255,.02)}
    tr:last-child td{border-bottom:none}

    /* FACTURA CARD */
    .fc{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r2);
      margin-bottom:8px;overflow:hidden;transition:border-color .15s}
    .fc:active{border-color:var(--b2)}

    /* BADGE */
    .badge{font-size:9px;padding:3px 9px;border-radius:20px;font-weight:700;display:inline-block}

    /* DROP ZONE */
    .drop-zone{border:2px dashed var(--b2);border-radius:var(--r3);
      padding:32px;text-align:center;cursor:pointer;background:var(--s1);
      margin-bottom:12px;transition:all .2s}
    .drop-zone:active{border-color:var(--cyan);background:rgba(34,211,238,.04)}

    /* FILTER ROW */
    .filter-row{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;
      padding-bottom:4px;scrollbar-width:none}
    .filter-btn{border:1px solid var(--b1);border-radius:20px;padding:5px 13px;
      font-size:10px;cursor:pointer;white-space:nowrap;background:var(--s2);
      color:var(--t3);font-family:inherit;transition:all .15s}

    /* TOAST */
    .toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);
      z-index:1000;padding:12px 20px;border-radius:var(--r1);font-size:12px;
      color:#fff;max-width:300px;text-align:center;font-weight:600;
      box-shadow:0 8px 40px rgba(0,0,0,.5);backdrop-filter:blur(10px)}

    /* MODAL */
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;
      display:flex;align-items:center;justify-content:center;padding:20px;
      backdrop-filter:blur(8px)}
    .modal{background:var(--s2);border:1px solid var(--b2);
      border-radius:var(--r3);padding:24px;width:100%;max-width:320px}

    /* SECTION TITLE */
    .section-title{font-size:15px;font-weight:700;margin-bottom:12px;color:var(--t1)}

    /* HERO */
    .hero{background:linear-gradient(135deg,var(--s2) 0%,#0D1929 100%);
      border:1px solid var(--b1);border-radius:var(--r3);padding:22px;
      margin-bottom:20px;position:relative;overflow:hidden}
    .hero::before{content:'';position:absolute;top:-50px;right:-30px;
      width:160px;height:160px;border-radius:50%;
      background:radial-gradient(circle,rgba(34,211,238,.1),transparent 70%)}

    /* MISC */
    .stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:18px}
    .plan-card{background:var(--s2);border:1px solid var(--b1);
      border-radius:var(--r2);padding:14px;margin-bottom:10px;cursor:pointer}
    .method-btn{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r1);
      padding:10px;font-size:11px;cursor:pointer;font-family:inherit;color:var(--t2)}
    ::-webkit-scrollbar{display:none}
    *{scrollbar-width:none}
  </style>

  <link rel="apple-touch-icon" href="icon-192.png">

function makeChecksum(plan,maxEmp,expiry,ts){
  const str=`${plan}|${maxEmp}|${expiry}|${ts}|${CF_SECRET}`;
  let h=5381;for(let i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))|0;
  return Math.abs(h).toString(36).toUpperCase().slice(0,6);
}

function generarCodigoURL(plan,clienteNombre,meses){
  const cfg=PLAN_CONFIG[plan];
  const exp=new Date();exp.setMonth(exp.getMonth()+meses);
  const expiryStr=exp.toISOString().slice(0,7);
  const ts=Date.now();
  const c=makeChecksum(plan,cfg.maxEmpresas,expiryStr,ts);
  const data={p:plan,m:cfg.maxEmpresas,e:expiryStr,n:clienteNombre,t:ts,c};
  const encoded=btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  return window.location.origin+window.location.pathname+'?activate='+encoded;
}

function validarCodigo(encoded){
  try{
    const data=JSON.parse(decodeURIComponent(escape(atob(encoded))));
    const{p,m,e,n,t,c}=data;
    if(c!==makeChecksum(p,m,e,t))return null;
    const exp=new Date(e+'-28');
    if(new Date()>exp)return{error:'Código vencido el '+e};
    return{plan:p,maxEmpresas:m,expiry:e,clienteNombre:n};
  }catch(e){return null;}
}

var satState={token:null,rfc:null,idSolicitud:null,paquetes:[],estado:null,paso:0,log:[]};
var SAT_FN = (location.protocol==='file:') ? null : '/.netlify/functions/sat-descarga';

function satLog(msg){satState.log.unshift('['+new Date().toLocaleTimeString('es-MX')+'] '+msg);if(satState.log.length>20)satState.log.pop();}

async function satCall(payload){
  if(!SAT_FN){toast('Solo disponible en la versión online (Netlify)','err');throw new Error('Sin backend');}
  const res=await fetch(SAT_FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const data=await res.json();
  if(!data.ok) throw new Error(data.error||'Error desconocido del SAT');
  return data;
}

async function satAutenticar(){
  var cer=document.getElementById('sat-cer')?.files[0];
  var key=document.getElementById('sat-key')?.files[0];
  var pass=document.getElementById('sat-pass')?.value||'';
  if(!cer||!key||!pass){toast('Selecciona .cer, .key y contraseña','err');return;}
  toast('Conectando con el SAT...','info');
  satState.log=[];satState.paso=1;
  try{
    var [cerB64,keyB64]=await Promise.all([fileToB64(cer),fileToB64(key)]);
    var r=await satCall({action:'autenticar',certBase64:cerB64,keyBase64:keyB64,keyPass:pass});
    satState.token=r.token;satState.rfc=r.rfc;satState.paso=2;
    satLog('Autenticado como '+r.rfc);
    toast('Conectado al SAT ✅ RFC: '+r.rfc);
    render();
  }catch(e){satLog('Error auth: '+e.message);toast(e.message,'err');satState.paso=0;render();}
}

async function satSolicitar(){
  if(!satState.token){toast('Primero conéctate al SAT','err');return;}
  var fi=document.getElementById('sat-fi')?.value;
  var ff=document.getElementById('sat-ff')?.value;
  var tipo=document.getElementById('sat-tipo')?.value||'R';
  var tipoSol=document.getElementById('sat-sol')?.value||'CFDI';
  if(!fi||!ff){toast('Selecciona el rango de fechas','err');return;}
  toast('Solicitando descarga al SAT...','info');
  try{
    var r=await satCall({action:'solicitar',token:satState.token,rfc:satState.rfc,fechaInicio:fi,fechaFinal:ff,tipoComp:tipo,tipoSol:tipoSol});
    satState.idSolicitud=r.idSolicitud;satState.estado='1';satState.paso=3;
    satLog('Solicitud enviada: '+r.idSolicitud+' (código '+r.codEstatus+')');
    toast('Solicitud enviada ✅');
    render();
  }catch(e){satLog('Error solicitud: '+e.message);toast(e.message,'err');}
}

async function satVerificar(){
  if(!satState.idSolicitud){toast('Primero envía la solicitud','err');return;}
  toast('Verificando estado...','info');
  try{
    var r=await satCall({action:'verificar',token:satState.token,rfc:satState.rfc,idSolicitud:satState.idSolicitud});
    satState.estado=r.estado;satState.paquetes=r.paquetes||[];
    var msgs={1:'Aceptada',2:'En proceso',3:'Lista para descargar ✅',4:'Error en solicitud',5:'Expirada'};
    satLog('Estado: '+(msgs[r.estado]||r.estado)+' | CFDIs: '+r.numCfdis+' | Paquetes: '+satState.paquetes.length);
    if(r.estado==='3'){satState.paso=4;toast('¡Lista! '+satState.paquetes.length+' paquete(s) para descargar ✅');}
    else toast('Estado: '+(msgs[r.estado]||r.estado)+' (CFDIs: '+r.numCfdis+')','info');
    render();
  }catch(e){satLog('Error verificar: '+e.message);toast(e.message,'err');}
}

async function satDescargarTodo(){
  if(!satState.paquetes.length){toast('No hay paquetes disponibles','err');return;}
  var total=0,dups=0,errs=0;
  toast('Descargando '+satState.paquetes.length+' paquete(s)...','info');
  for(var i=0;i<satState.paquetes.length;i++){
    var paq=satState.paquetes[i];
    try{
      var r=await satCall({action:'descargar',token:satState.token,rfc:satState.rfc,idPaquete:paq});
      (r.xmlFiles||[]).forEach(function(f){
        try{
          var cfdi=parseCFDI(f.contenido);
          if(facturas.some(function(x){return x.uuid===cfdi.uuid;})){dups++;}
          else{
            facturas.unshift({id:'f'+Date.now()+'_'+total,uuid:cfdi.uuid,nombre:cfdi.nombre,rfc:cfdi.rfc,
              fecha:cfdi.fecha,subtotal:cfdi.subtotal,iva:cfdi.iva,total:cfdi.total,concepto:cfdi.concepto,
              isrRetencion:cfdi.isrRetencion||0,ivaRetencion:cfdi.ivaRetencion||0,
              regimenFiscal:cfdi.regimenFiscal||'',regimenNombre:cfdi.regimenNombre||'',status:'provisionada'});
            total++;
          }
        }catch(ex){errs++;console.error('XML',f.nombre,ex.message);}
      });
      satLog('Paquete '+(i+1)+'/'+satState.paquetes.length+': '+(r.xmlFiles||[]).length+' XMLs');
    }catch(e){errs++;satLog('Error paquete '+paq+': '+e.message);}
  }
  guardar();
  var msg=total+' facturas importadas';
  if(dups>0)msg+=' | '+dups+' duplicadas';
  if(errs>0)msg+=' | '+errs+' errores';
  toast(msg+(total>0?' ✅':''));
  satState.paso=5;render();
}

function satReset(){satState={token:null,rfc:null,idSolicitud:null,paquetes:[],estado:null,paso:0,log:[]};render();}

function fileToB64(file){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(e){
      var ab=e.target.result;
      var b=new Uint8Array(ab);var s='';
      for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);
      res(btoa(s));
    };
    r.onerror=rej;
    r.readAsArrayBuffer(file);
  });
}

// ── PARSER CFDI (con retenciones ISR e IVA) ───────────────────────────────────
function parseCFDI(xml){
  const doc=new DOMParser().parseFromString(xml,'text/xml');
  if(doc.documentElement.nodeName==='parsererror')throw new Error('XML inválido');
  const ns='http://www.sat.gob.mx/cfd/4',tns='http://www.sat.gob.mx/TimbreFiscalDigital';
  const root=doc.documentElement;
  const emisor=doc.getElementsByTagNameNS(ns,'Emisor')[0];
  const tfd=doc.getElementsByTagNameNS(tns,'TimbreFiscalDigital')[0];
  const c0=doc.getElementsByTagNameNS(ns,'Concepto')[0];
  // IVA trasladado
  let iva=0;
  for(const t of doc.getElementsByTagNameNS(ns,'Traslado'))
    if(t.getAttribute('Impuesto')==='002')iva+=parseFloat(t.getAttribute('Importe')||0);
  // Retenciones ISR (001) e IVA (002)
  let isrRet=0,ivaRet=0;
  for(const r of doc.getElementsByTagNameNS(ns,'Retencion')){
    if(r.getAttribute('Impuesto')==='001')isrRet+=parseFloat(r.getAttribute('Importe')||0);
    if(r.getAttribute('Impuesto')==='002')ivaRet+=parseFloat(r.getAttribute('Importe')||0);
  }
  const regimenFiscal = emisor?.getAttribute('RegimenFiscal')||'';
  const REGIMENES = {
    '601':'General Personas Morales',
    '606':'Arrendamiento',
    '612':'Act. Empresarial y Profesional',
    '621':'Incorporación Fiscal',
    '625':'RESICO Personas Morales',
    '626':'RESICO Personas Físicas',
    '630':'Enajenación de Acciones',
  };
  return{
    uuid:tfd?.getAttribute('UUID')||'LOCAL-'+Date.now(),
    fecha:(root.getAttribute('Fecha')||'').slice(0,10),
    nombre:emisor?.getAttribute('Nombre')||'Proveedor',
    rfc:emisor?.getAttribute('Rfc')||'',
    subtotal:parseFloat(root.getAttribute('SubTotal')||0),
    iva:parseFloat(iva.toFixed(2)),
    total:parseFloat(root.getAttribute('Total')||0),
    isrRetencion:parseFloat(isrRet.toFixed(2)),
    ivaRetencion:parseFloat(ivaRet.toFixed(2)),
    concepto:c0?.getAttribute('Descripcion')||'',
    regimenFiscal,
    regimenNombre:REGIMENES[regimenFiscal]||'Régimen no identificado',
  };
}

// ── PARTIDAS CON RETENCIONES ──────────────────────────────────────────────────
function provPartidas(c){
  const concepto = (c.concepto||'Sin descripción').slice(0,40);
  const d = 'Fact. '+(c.rfc||'')+ (concepto?' | '+concepto:'');
  const rows=[
    {cuenta:'6010-001',nombre:'Gastos generales',    concepto:d,                  cargo:c.subtotal,abono:0},
    {cuenta:'1180-001',nombre:'IVA acreditable',      concepto:'IVA acreditable 16%',cargo:c.iva,   abono:0},
  ];
  if((c.isrRetencion||0)>0)rows.push({cuenta:'2150-001',nombre:'ISR retenido por pagar',concepto:'Ret. ISR '+(c.rfc||''),cargo:0,abono:c.isrRetencion});
  if((c.ivaRetencion||0)>0)rows.push({cuenta:'2160-001',nombre:'IVA retenido por pagar',concepto:'Ret. IVA '+(c.rfc||''),cargo:0,abono:c.ivaRetencion});
  rows.push({cuenta:'2100-001',nombre:'Proveedores',concepto:d,cargo:0,abono:c.total});
  return rows;
}

}

function exportAuxiliar(){
  const cuentas={};
  facturas.forEach(function(f){
    const partidas=provPartidas({rfc:f.rfc,concepto:f.concepto,subtotal:f.subtotal,iva:f.iva,total:f.total,isrRetencion:f.isrRetencion||0,ivaRetencion:f.ivaRetencion||0});
    partidas.forEach(function(p){
      if(!cuentas[p.cuenta])cuentas[p.cuenta]={nombre:p.nombre,movs:[],totalCargo:0,totalAbono:0};
      cuentas[p.cuenta].movs.push({fecha:f.fecha,concepto:f.nombre.slice(0,40),cargo:p.cargo,abono:p.abono});
      cuentas[p.cuenta].totalCargo+=p.cargo;
      cuentas[p.cuenta].totalAbono+=p.abono;
    });
  });
  var filas=[['CONTAFLOW MX — AUXILIAR CONTABLE'],['Generado: '+new Date().toLocaleDateString('es-MX')],[]];
  Object.entries(cuentas).forEach(function(entry){
    var cuenta=entry[0];var data=entry[1];
    filas.push([cuenta+' — '+data.nombre]);
    filas.push(['Fecha','Concepto','Cargo','Abono','Saldo']);
    var saldo=0;
    data.movs.forEach(function(m){
      saldo+=(m.cargo-m.abono);
      filas.push([m.fecha,m.concepto,m.cargo||0,m.abono||0,saldo]);
    });
    filas.push(['','TOTALES',data.totalCargo,data.totalAbono,data.totalCargo-data.totalAbono]);
    filas.push([]);
  });
  var bom='﻿';
  var csv=bom+filas.map(function(r){return r.map(function(c){var s=String(c===null||c===undefined?'':c);return(s.includes(',')||s.includes('"')||s.includes('\n'))?'"'+s.replace(/"/g,'""')+'"':s;}).join(',');}).join('\r\n');
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='Auxiliar_Contable_'+new Date().toISOString().slice(0,10)+'.csv';
  a.style.display='none';document.body.appendChild(a);a.click();
  setTimeout(function(){try{document.body.removeChild(a);}catch(e){}URL.revokeObjectURL(url);},3000);
  toast('📊 Auxiliar descargado ✅');
}

document.getElementById('xml-input').addEventListener('change',function(e){
  var files=Array.from(e.target.files);
  if(!files.length)return;

  // Un solo archivo: flujo normal con preview
  if(files.length===1){
    var r=new FileReader();
    r.onload=function(ev){
      try{st.cfdi=parseCFDI(ev.target.result);st.view='nueva';render();}
      catch(err){toast('XML inválido o no es CFDI del SAT','err');}
    };
    r.readAsText(files[0]);
    this.value='';
    return;
  }

  // Carga masiva: procesar todos sin preview
  var total=files.length;
  var procesados=0;
  var errores=0;
  var duplicados=0;

  toast('Procesando '+total+' archivos...','info');

  function procesarSiguiente(idx){
    if(idx>=files.length){
      // Terminado
      guardar();
      st.view='historial';
      render();
      var msg='✅ '+procesados+' facturas registradas';
      if(duplicados>0) msg+=' | '+duplicados+' duplicadas';
      if(errores>0) msg+=' | '+errores+' errores';
      toast(msg);
      return;
    }

    var r=new FileReader();
    r.onload=function(ev){
      try{
        var cfdi=parseCFDI(ev.target.result);
        // Verificar duplicado
        if(facturas.some(function(f){return f.uuid===cfdi.uuid;})){
          duplicados++;
        } else {
          facturas.unshift({
            id:'f'+Date.now()+'_'+idx,
            uuid:cfdi.uuid,
            nombre:cfdi.nombre,
            rfc:cfdi.rfc,
            fecha:cfdi.fecha,
            subtotal:cfdi.subtotal,
            iva:cfdi.iva,
            total:cfdi.total,
            concepto:cfdi.concepto,
            isrRetencion:cfdi.isrRetencion||0,
            ivaRetencion:cfdi.ivaRetencion||0,
            regimenFiscal:cfdi.regimenFiscal||'',
            regimenNombre:cfdi.regimenNombre||'',
            status:'provisionada'
          });
          procesados++;
        }
      }catch(err){
        errores++;
        console.error('Error en archivo '+idx+':',err);
      }
      // Actualizar toast de progreso
      toast('Procesando '+(idx+1)+'/'+total+'...','info');
      setTimeout(function(){procesarSiguiente(idx+1);},50);
    };
    r.readAsText(files[idx]);
  }

  procesarSiguiente(0);
  this.value='';
});

// ── EXPORTAR XML (SAT Contabilidad Electrónica) ───────────────────────────────
function exportarXML(id) {
  const f = facturas.find(x => x.id === id);
  if (!f) return;
  const prov = provPartidas({rfc:f.rfc,concepto:f.concepto,subtotal:f.subtotal,iva:f.iva,total:f.total,isrRetencion:f.isrRetencion||0,ivaRetencion:f.ivaRetencion||0});
  const mes = f.fecha.slice(5,7);
  const anio = f.fecha.slice(0,4);
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const trans = prov.map(p=>`    <PLZ:Transaccion NumCta="${p.cuenta}" DesCta="${esc(p.nombre)}" Concepto="${esc(p.concepto)}" Debe="${p.cargo.toFixed(2)}" Haber="${p.abono.toFixed(2)}"/>`).join('\n');
  const xml = `<?xml version="1.0" encoding="UTF-8"?>
<PLZ:Polizas xmlns:PLZ="http://www.sat.gob.mx/esquemas/ContabilidadE/1_3/PolizasPeriodo"
  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
  xsi:schemaLocation="http://www.sat.gob.mx/esquemas/ContabilidadE/1_3/PolizasPeriodo http://www.sat.gob.mx/esquemas/ContabilidadE/1_3/PolizasPeriodo/PolizasPeriodo_1_3.xsd"
  Version="1.3" RFC="XAXX010101000" Mes="${mes}" Anio="${anio}" TipoSolicitud="AF">
  <PLZ:Poliza NumUnIdenPol="PROV-${id.slice(-6).toUpperCase()}" Fecha="${f.fecha}" Concepto="${esc('Provision ' + f.nombre)}">
${trans}
  </PLZ:Poliza>
</PLZ:Polizas>`;
  const blob = new Blob([xml], {type:'text/xml;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `poliza_${f.rfc}_${f.fecha}.xml`;
  a.style.display='none';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){try{document.body.removeChild(a);}catch(e){}URL.revokeObjectURL(url);},300);
  toast('XML descargado ✅');
}

function renderAEP612(){

  const totalIng=ingMes.reduce((s,i)=>s+i.monto,0);
  const totalGas=gasMes.reduce((s,g)=>s+g.monto,0);
  const retenISR=ingMes.reduce((s,i)=>s+(i.retencionISR?i.monto*0.10:0),0);
  const ivaT=ingMes.filter(i=>i.iva).reduce((s,i)=>s+i.monto*0.16,0);

// ISR tabla mensual 2024
const TABLA_ISR=[
  {li:0,cuota:0,pct:1.92},{li:746.05,cuota:14.32,pct:6.40},
  {li:6332.06,cuota:371.83,pct:10.88},{li:11128.02,cuota:893.63,pct:16.00},

];
function calcISR(base){
  if(base<=0)return 0;
  const t=[...TABLA_ISR].reverse().find(x=>base>=x.li);
  if(!t)return 0;
  return t.cuota+(base-t.li)*(t.pct/100);
}

      <div style="font-size:9px;color:var(--text-3)">IVA a pagar</div>

  <div style="display:flex;gap:6px;margin-bottom:14px;overflow-x:auto">
    ${tabs.map(([id,label])=>`<button style="border:1px solid ${aepTab===id?'#3B82F6':'#1E293B'};background:${aepTab===id?'#1D4ED822':'#111827'};color:${aepTab===id?'#60A5FA':'#64748B'};border-radius:20px;padding:5px 12px;font-size:10px;cursor:pointer;white-space:nowrap;font-weight:${aepTab===id?700:400};font-family:inherit" onclick="aepTab='${id}';render()">${label}</button>`).join('')}

      .forEach(p=>movs.push({...p,fecha:f.fecha,proveedor:f.nombre,rfc:f.rfc,tipo:'pago',uuid:f.uuid,status:f.status}));
    }
  });
  return movs;
}

function descargarCSV(filas,nombre){
  const csv=filas.map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=nombre+'.csv';
  a.style.display='none';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){try{document.body.removeChild(a);}catch(e){}URL.revokeObjectURL(url);},300);
  toast('Descargando '+nombre+' ✅');
}

function balanceComprobacion(){
  const movs=generarMovimientos();
  const cuentas={};
  movs.forEach(m=>{
    if(!cuentas[m.cuenta])cuentas[m.cuenta]={nombre:m.nombre,debe:0,haber:0};
    cuentas[m.cuenta].debe+=m.cargo;
    cuentas[m.cuenta].haber+=m.abono;
  });
  const entries=Object.entries(cuentas).sort((a,b)=>a[0].localeCompare(b[0]));
  const totDebe=entries.reduce((s,[,c])=>s+c.debe,0);
  const totHaber=entries.reduce((s,[,c])=>s+c.haber,0);

  function descBalance(){
    const filas=[['Cuenta','Nombre','Sumas Debe','Sumas Haber','Saldo Deudor','Saldo Acreedor']];
    entries.forEach(([cta,c])=>{
      const sd=c.debe>c.haber?c.debe-c.haber:0;
      const sa=c.haber>c.debe?c.haber-c.debe:0;
      filas.push([cta,c.nombre,c.debe,c.haber,sd,sa]);
    });
    filas.push(['','TOTALES',totDebe,totHaber,'','']);
    descargarCSV(filas,'Balance_Comprobacion');
  }

  return`
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <div style="font-size:12px;font-weight:700">⚖️ Balance de Comprobación</div>
    <button onclick="exportBalance()" style="background:#059669;border:none;border-radius:8px;padding:7px 12px;font-size:10px;color:white;cursor:pointer;font-family:inherit;font-weight:700">📊 Descargar Excel</button>
  </div>
  ${totDebe===totHaber?`<div style="background:#071A10;border:1px solid #166534;border-radius:8px;padding:8px;margin-bottom:10px;font-size:10px;color:var(--green);font-weight:700">✅ Cuadrado — Debe = Haber = ${fmt(totDebe)}</div>`:''}
  <div style="overflow-x:auto">
    <table style="min-width:480px">
      <tr><th>Cuenta</th><th>Nombre</th><th>Debe</th><th>Haber</th><th>S.Deudor</th><th>S.Acreedor</th></tr>
      ${entries.map(([cta,c])=>{
        const sd=c.debe>c.haber?c.debe-c.haber:0;
        const sa=c.haber>c.debe?c.haber-c.debe:0;
        return`<tr>
          <td style="color:var(--primary-l);font-family:monospace;font-size:9px">${cta}</td>
          <td style="color:var(--text);font-size:9px">${c.nombre}</td>
          <td style="color:var(--green);font-size:9px">${c.debe>0?fmt(c.debe):'—'}</td>
          <td style="color:var(--red);font-size:9px">${c.haber>0?fmt(c.haber):'—'}</td>
          <td style="color:var(--primary-l);font-size:9px">${sd>0?fmt(sd):'—'}</td>
          <td style="color:#A78BFA;font-size:9px">${sa>0?fmt(sa):'—'}</td>
        </tr>`;}).join('')}
      <tr style="border-top:2px solid #334155">
        <td colspan="2" style="font-weight:700;color:var(--text-3);font-size:10px;padding:6px 4px">TOTALES</td>
        <td style="font-weight:800;color:var(--green)">${fmt(totDebe)}</td>
        <td style="font-weight:800;color:var(--red)">${fmt(totHaber)}</td>
        <td></td><td></td>
      </tr>
    </table>
  </div>`;
}

function cedulaGastos(){
  const gastosCtas={};
  facturas.forEach(f=>{
    const prov=provPartidas({rfc:f.rfc,concepto:f.concepto,subtotal:f.subtotal,iva:f.iva,total:f.total,isrRetencion:f.isrRetencion||0,ivaRetencion:f.ivaRetencion||0});
    prov.filter(p=>p.cuenta.startsWith('6')).forEach(p=>{
      if(!gastosCtas[p.cuenta])gastosCtas[p.cuenta]={nombre:p.nombre,movs:[],total:0};
      gastosCtas[p.cuenta].movs.push({fecha:f.fecha,proveedor:f.nombre,monto:p.cargo});
      gastosCtas[p.cuenta].total+=p.cargo;
    });
  });
  const totalGastos=Object.values(gastosCtas).reduce((s,c)=>s+c.total,0);

  function descGastos(){
    const filas=[['Cuenta','Nombre Cuenta','Fecha','Proveedor','Monto']];
    Object.entries(gastosCtas).forEach(([cta,c])=>{
      c.movs.forEach(m=>filas.push([cta,c.nombre,m.fecha,m.proveedor,m.monto]));
      filas.push([cta,'SUBTOTAL '+c.nombre,'','',c.total]);
    });
    filas.push(['','TOTAL GASTOS','','',totalGastos]);
    descargarCSV(filas,'Cedula_Gastos');
  }

  return`
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <div style="font-size:12px;font-weight:700">📤 Cédula de Gastos por Cuenta</div>

  </div>
  <div style="background:var(--surface2);border-radius:10px;padding:10px;margin-bottom:12px">
    <div style="font-size:9px;color:var(--text-3)">Total gastos del período</div>
    <div style="font-size:16px;font-weight:800;color:var(--red);margin-top:2px">${fmt(totalGastos)}</div>
  </div>

function csvEnc(v){
  var s=String(v===null||v===undefined?'':v);
  if(s.includes(',')||s.includes('"')||s.includes('\n'))
    return '"'+s.replace(/"/g,'""')+'"';
  return s;
}

function descargarCSV(filas,nombre){
  // Genera XLS estilizado con formato ContaFlow
  var hoy=new Date().toLocaleDateString('es-MX');
  var titulo=filas[0]&&filas[0][0]?String(filas[0][0]):'ContaFlow MX';
  var subtitulo=filas[1]&&filas[1][0]?String(filas[1][0]):'';
  var startIdx=3;
  while(startIdx<filas.length&&(!filas[startIdx]||filas[startIdx].length===0||filas[startIdx].every(function(c){return c===''||c===null||c===undefined;})))startIdx++;
  var headerRow=filas[startIdx]||[];
  var dataRows=filas.slice(startIdx+1);
  var cols=Math.max(headerRow.length,1);
  function escH(v){var s=String(v===null||v===undefined?'':v);return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function numC(v){if(typeof v==='number'||(v!==''&&v!==null&&v!==undefined&&!isNaN(parseFloat(v))&&String(v).trim()!=='')){var n=parseFloat(v);if(!isNaN(n))return n.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});}return escH(v);}
  var html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">'
  +'<head><meta charset="UTF-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>'
  +'<x:Name>ContaFlow</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions>'
  +'</x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->'
  +'<style>body{font-family:Calibri,Arial,sans-serif;font-size:11pt}'
  +'.logo{background:#1D4ED8;color:#FFFFFF;font-size:15pt;font-weight:bold;padding:8px 14px}'
  +'.brand{background:#1E3A8A;color:#93C5FD;font-size:9pt;padding:3px 14px}'
  +'.rep{background:#1D4ED8;color:#FFFFFF;font-size:13pt;font-weight:bold;padding:6px 14px}'
  +'.sub{background:#EFF6FF;color:#1E40AF;font-size:9pt;padding:4px 14px;border-bottom:2px solid #1D4ED8}'
  +'.th{background:#1D4ED8;color:#FFF;font-weight:bold;font-size:10pt;padding:6px 8px;border:1px solid #1E40AF;text-align:center}'
  +'.thn{background:#1D4ED8;color:#FFF;font-weight:bold;font-size:10pt;padding:6px 8px;border:1px solid #1E40AF;text-align:right}'
  +'.td{padding:5px 8px;border:1px solid #E2E8F0;font-size:10pt}'
  +'.tdn{padding:5px 8px;border:1px solid #E2E8F0;font-size:10pt;text-align:right}'
  +'.alt{background:#F0F7FF}'
  +'.tot{background:#FEF3C7;font-weight:bold;padding:5px 8px;border:1px solid #E2E8F0;border-top:2px solid #D97706}'
  +'.totn{background:#FEF3C7;font-weight:bold;padding:5px 8px;border:1px solid #E2E8F0;border-top:2px solid #D97706;text-align:right}'
  +'</style></head><body>'
  +'<table border="0" cellspacing="0" cellpadding="0">'
  +'<tr><td colspan="'+cols+'" class="logo">&#9702; ContaFlow MX</td></tr>'
  +'<tr><td colspan="'+cols+'" class="brand">Del XML del SAT a la poliza contable &mdash; automatico</td></tr>'
  +'<tr><td colspan="'+cols+'" class="rep">'+escH(titulo.replace(/^CONTAFLOW MX\s*[—-]\s*/i,''))+'</td></tr>'
  +'<tr><td colspan="'+cols+'" class="sub">'+escH(subtitulo)+'</td></tr>'
  +'<tr><td colspan="'+cols+'" style="padding:4px">&nbsp;</td></tr>'
  +'<tr>'+headerRow.map(function(h){var s=String(h||'');var n=/monto|cargo|abono|total|iva|isr|subtotal|saldo|importe|neto|precio/i.test(s);return'<td class="'+(n?'thn':'th')+'">'+escH(s)+'</td>';}).join('')+'</tr>';
  dataRows.forEach(function(row,idx){
    if(!row||row.length===0)return;
    if(row.every(function(c){return c===''||c===null||c===undefined;}))return;
    var isTot=row.some(function(c){return/^TOTAL|^SUBTOTAL/i.test(String(c||''));});
    html+='<tr>'+row.map(function(c){
      var s=String(c===null||c===undefined?'':c);
      var isNum=(typeof c==='number')||(s.trim()!==''&&!isNaN(parseFloat(s.replace(/[$, ]/g,''))));
      var base=isTot?(isNum?'totn':'tot'):(isNum?'tdn':'td');
      var alt=(!isTot&&idx%2===0)?' alt':'';
      return'<td class="'+base+alt+'">'+numC(c)+'</td>';
    }).join('')+'</tr>';
  });
  html+='</table><br><p style="font-size:8pt;color:#94A3B8">Generado por ContaFlow MX &bull; '+hoy+'</p></body></html>';
  var blob=new Blob([html],{type:'application/vnd.ms-excel;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download=nombre+'_'+new Date().toISOString().slice(0,10)+'.xls';
  a.style.display='none';document.body.appendChild(a);a.click();
  setTimeout(function(){try{document.body.removeChild(a);}catch(e){}URL.revokeObjectURL(url);},5000);
  toast('\ud83d\udcca Excel descargado \u2705');
}

function cabecera(titulo){
  var hoy=new Date().toLocaleDateString('es-MX');
  return[['CONTAFLOW MX — '+titulo.toUpperCase()],['Generado: '+hoy+' | Facturas: '+facturas.length],[]];
}

function exportProveedores(){
  var tot=facturas.reduce(function(s,f){return s+f.total;},0);
  var filas=cabecera('Cedula de Proveedores');
  filas.push(['N°','Proveedor','RFC','Fecha','Subtotal','IVA','ISR Ret.','IVA Ret.','Total','Estatus']);
  facturas.forEach(function(f,i){filas.push([i+1,f.nombre,f.rfc,f.fecha,f.subtotal,f.iva,f.isrRetencion||0,f.ivaRetencion||0,f.total,f.status]);});
  filas.push([]);filas.push(['','','','TOTAL','','','','',tot,'']);
  descargarCSV(filas,'Cedula_Proveedores');
}

function exportBancos(){
  var pagos=facturas.filter(function(f){return f.status==='pagada';});
  var tot=pagos.reduce(function(s,f){return s+f.total;},0);
  var filas=cabecera('Cedula de Bancos');
  filas.push(['N°','Fecha','Proveedor','RFC','Cargo','Abono']);
  pagos.forEach(function(f,i){filas.push([i+1,f.fecha,f.nombre,f.rfc,0,f.total]);});
  filas.push([]);filas.push(['','TOTAL SALIDAS','','','',tot]);
  descargarCSV(filas,'Cedula_Bancos');
}

function exportIVA(){
  var totA=facturas.reduce(function(s,f){return s+f.iva;},0);
  var totR=facturas.reduce(function(s,f){return s+(f.ivaRetencion||0);},0);
  var filas=cabecera('Cedula de IVA');
  filas.push(['N°','Proveedor','RFC','Fecha','IVA Acreditable','IVA Retenido','IVA Neto']);
  facturas.forEach(function(f,i){filas.push([i+1,f.nombre,f.rfc,f.fecha,f.iva,f.ivaRetencion||0,f.iva-(f.ivaRetencion||0)]);});
  filas.push([]);filas.push(['','','TOTALES','',totA,totR,totA-totR]);
  descargarCSV(filas,'Cedula_IVA');
}

function exportISR(){
  var conRet=facturas.filter(function(f){return f.isrRetencion>0;});
  var tot=conRet.reduce(function(s,f){return s+(f.isrRetencion||0);},0);
  var filas=cabecera('Cedula ISR Retenido');
  filas.push(['N°','Proveedor','RFC','Fecha','Subtotal','Tasa','ISR Retenido']);
  conRet.forEach(function(f,i){filas.push([i+1,f.nombre,f.rfc,f.fecha,f.subtotal,'10%',f.isrRetencion]);});
  filas.push([]);filas.push(['','','TOTAL ISR','','','',tot]);
  descargarCSV(filas,'Cedula_ISR_Retenido');
}

function exportBalance(){
  var movs=generarMovimientos();var ctas={};
  movs.forEach(function(m){
    if(!ctas[m.cuenta])ctas[m.cuenta]={nombre:m.nombre,debe:0,haber:0};
    ctas[m.cuenta].debe+=m.cargo;ctas[m.cuenta].haber+=m.abono;
  });
  var entries=Object.entries(ctas).sort(function(a,b){return a[0].localeCompare(b[0]);});
  var totD=entries.reduce(function(s,e){return s+e[1].debe;},0);
  var totH=entries.reduce(function(s,e){return s+e[1].haber;},0);
  var filas=cabecera('Balance de Comprobacion');
  filas.push(['Cuenta','Nombre','Sumas Debe','Sumas Haber','Saldo Deudor','Saldo Acreedor']);
  entries.forEach(function(e){
    var sd=e[1].debe>e[1].haber?e[1].debe-e[1].haber:0;
    var sa=e[1].haber>e[1].debe?e[1].haber-e[1].debe:0;
    filas.push([e[0],e[1].nombre,e[1].debe,e[1].haber,sd,sa]);
  });
  filas.push([]);filas.push(['TOTALES','',totD,totH,'','']);
  descargarCSV(filas,'Balance_Comprobacion');
}

function exportGastos(){
  var gastosCtas={};
  facturas.forEach(function(f){
    var prov=provPartidas({rfc:f.rfc,concepto:f.concepto,subtotal:f.subtotal,iva:f.iva,total:f.total,isrRetencion:f.isrRetencion||0,ivaRetencion:f.ivaRetencion||0});
    prov.filter(function(p){return p.cuenta.startsWith('6');}).forEach(function(p){
      if(!gastosCtas[p.cuenta])gastosCtas[p.cuenta]={nombre:p.nombre,movs:[],total:0};
      gastosCtas[p.cuenta].movs.push([f.fecha,f.nombre,p.cargo]);
      gastosCtas[p.cuenta].total+=p.cargo;
    });
  });
  var tot=Object.values(gastosCtas).reduce(function(s,c){return s+c.total;},0);
  var filas=cabecera('Cedula de Gastos');
  filas.push(['Cuenta','Nombre Cuenta','Fecha','Proveedor','Monto']);
  Object.entries(gastosCtas).forEach(function(e){
    e[1].movs.forEach(function(m){filas.push([e[0],e[1].nombre,m[0],m[1],m[2]]);});
    filas.push([e[0],'SUBTOTAL','','',e[1].total]);filas.push([]);
  });
  filas.push(['TOTAL GASTOS','','','',tot]);
  descargarCSV(filas,'Cedula_Gastos');
}

function exportLibroCompleto(){
  exportProveedores();
  setTimeout(function(){exportBancos();},500);

function importarDatos(input){
  var file=input.files[0];
  if(!file)return;
  var r=new FileReader();
  r.onload=function(e){
    try{
      var datos=JSON.parse(e.target.result);
      if(!datos.version||!datos.facturas){
        toast('Archivo no válido — usa un backup de ContaFlow','err');
        return;
      }
      // Guardar todo
      if(datos.facturas)  {facturas=datos.facturas;    guardar();}
      if(datos.nominas)   {nominas=datos.nominas;       guardarNominas();}
      if(datos.empresas)  {empresas=datos.empresas;     guardarEmpresas();}
      if(datos.aepData)   {aepData=datos.aepData;       guardarAEP();}
      if(datos.resicoData){resicoData=datos.resicoData; guardarResico();}
      if(datos.arrData)   {arrData=datos.arrData;       guardarArr();}
      if(datos.planInfo)  {guardarPlan(datos.planInfo); planInfo=cargarPlan();}
      localStorage.setItem('cf_ultimo_backup',new Date().toISOString());
      st.view='dashboard';
      render();
      toast('✅ '+datos.facturas.length+' facturas y '+datos.nominas.length+' nóminas importadas');
    }catch(err){
      toast('Error al importar: '+err.message,'err');
    }
  };
  r.readAsText(file);
  input.value='';
}

    +'<label style="display:flex;align-items:center;gap:8px;background:#0B1221;border:1px dashed #1E3A5F;border-radius:8px;padding:8px;cursor:pointer">'
    +'<input type="file" id="sat-key" accept=".key" style="display:none" onchange="document.getElementById(\'key-lbl\').textContent=this.files[0]?.name||\'Sin archivo\'">'
    +'<span style="font-size:14px">🗝️</span>'
    +'<span id="key-lbl" style="font-size:10px;color:var(--t3)">Seleccionar .key</span>'
    +'</label></div>'
    +'<div style="margin-bottom:12px">'
    +'<div style="font-size:10px;color:var(--t2);margin-bottom:4px">🔐 Contraseña de la e.firma</div>'
    +'<input type="password" id="sat-pass" placeholder="Contraseña FIEL" style="width:100%;background:#0B1221;border:1px solid #1E3A5F;border-radius:8px;padding:9px 12px;color:white;font-size:12px;font-family:inherit">'
    +'</div>'
    +'<button class="btn btn-primary" onclick="satAutenticar()">🛰️ Conectar al SAT</button>';

  } else if(p===1){
    html+='<div style="text-align:center;padding:14px">'
    +'<div style="font-size:28px;margin-bottom:8px">⏳</div>'
    +'<div style="font-size:12px;font-weight:700">Conectando con el SAT...</div>'
    +'<div style="font-size:10px;color:var(--t3);margin-top:4px">Firmando solicitud con tu FIEL</div></div>';

  } else if(p===2){
    // Paso 2: seleccionar rango
    var hoy=new Date().toISOString().slice(0,10);
    var hace3m=new Date(Date.now()-90*864e5).toISOString().slice(0,10);
    html+='<div style="background:#072010;border:1px solid #16532D;border-radius:8px;padding:8px;margin-bottom:12px;font-size:10px;color:var(--green)">'
    +'✅ Conectado como <strong>'+satState.rfc+'</strong></div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">'
    +'<div><div style="font-size:9px;color:var(--t3);margin-bottom:4px">Desde</div>'
    +'<input type="date" id="sat-fi" value="'+hace3m+'" style="width:100%;background:#0B1221;border:1px solid #1E3A5F;border-radius:8px;padding:8px;color:white;font-size:11px;font-family:inherit"></div>'
    +'<div><div style="font-size:9px;color:var(--t3);margin-bottom:4px">Hasta</div>'
    +'<input type="date" id="sat-ff" value="'+hoy+'" style="width:100%;background:#0B1221;border:1px solid #1E3A5F;border-radius:8px;padding:8px;color:white;font-size:11px;font-family:inherit"></div>'
    +'</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">'
    +'<div><div style="font-size:9px;color:var(--t3);margin-bottom:4px">Tipo</div>'
    +'<select id="sat-tipo" style="width:100%;background:#0B1221;border:1px solid #1E3A5F;border-radius:8px;padding:8px;color:white;font-size:11px;font-family:inherit">'
    +'<option value="R">Recibidas</option><option value="E">Emitidas</option></select></div>'
    +'<div><div style="font-size:9px;color:var(--t3);margin-bottom:4px">Formato</div>'
    +'<select id="sat-sol" style="width:100%;background:#0B1221;border:1px solid #1E3A5F;border-radius:8px;padding:8px;color:white;font-size:11px;font-family:inherit">'
    +'<option value="CFDI">XML CFDI</option><option value="Metadata">Metadata</option></select></div>'
    +'</div>'
    +'<button class="btn btn-primary" onclick="satSolicitar()">📤 Enviar solicitud al SAT</button>';

  } else if(p===3){
    var estados={'1':'Aceptada ⏳','2':'En proceso ⚙️','3':'Lista ✅','4':'Error ❌','5':'Expirada ⌛'};
    html+='<div style="background:#072010;border:1px solid #16532D;border-radius:8px;padding:8px;margin-bottom:10px;font-size:10px;color:var(--green)">'
    +'✅ Conectado: <strong>'+satState.rfc+'</strong></div>'
    +'<div style="background:#0B1221;border:1px solid #1E3A5F;border-radius:8px;padding:10px;margin-bottom:10px">'
    +'<div style="font-size:10px;color:var(--t2)">Solicitud: <span style="color:white;font-weight:700">'+satState.idSolicitud+'</span></div>'
    +'<div style="font-size:10px;color:var(--t2);margin-top:4px">Estado: <span style="font-weight:700">'+(estados[satState.estado]||satState.estado||'—')+'</span></div>'
    +(satState.paquetes.length>0?'<div style="font-size:10px;color:var(--cyan);margin-top:4px">'+satState.paquetes.length+' paquete(s) listo(s)</div>':'')
    +'</div>'
    +(satState.estado==='3'
      ?'<button class="btn btn-success" onclick="satDescargarTodo()" style="margin-bottom:8px">⬇️ Descargar '+satState.paquetes.length+' paquete(s) e importar</button>'
      :'')
    +'<button class="btn btn-secondary" onclick="satVerificar()" style="font-size:11px">🔄 Actualizar estado</button>';

  } else if(p===4){
    html+='<div style="background:#072010;border:1px solid #16532D;border-radius:8px;padding:10px;margin-bottom:12px;font-size:11px;color:var(--green);text-align:center">'
    +'✅ '+satState.paquetes.length+' paquete(s) listos para descargar</div>'
    +'<button class="btn btn-success" onclick="satDescargarTodo()" style="margin-bottom:8px">⬇️ Importar todos los XML a ContaFlow</button>'
    +'<button class="btn btn-secondary" onclick="satVerificar()" style="font-size:11px">🔄 Reverificar estado</button>';

  } else if(p===5){
    html+='<div style="background:#072010;border:1px solid #16532D;border-radius:8px;padding:10px;margin-bottom:12px;font-size:11px;color:var(--green);text-align:center">'
    +'✅ Descarga completada. Ve a Historial para ver tus facturas.</div>'
    +'<button class="btn btn-primary" onclick="goto(\'historial\')">📋 Ver historial de facturas</button>';
  }

  // Log de actividad (siempre visible si hay entradas)
  if(satState.log.length>0){
    html+='<div style="margin-top:10px;background:#050810;border:1px solid #0F1F3A;border-radius:8px;padding:8px;max-height:100px;overflow-y:auto">'
    +'<div style="font-size:9px;color:var(--t3);font-weight:700;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">Log</div>'
    +satState.log.map(function(l){return'<div style="font-size:9px;color:#4A5568;padding:2px 0;border-bottom:1px solid #0F172A">'+l+'</div>';}).join('')
    +'</div>';
  }

  html+='</div>';
  return html;
}

// ── RENDER ───────────────────────────────────────────────────────────────────
function render(){
  var v={
    dashboard:vDashboard, nueva:vNueva, historial:vHistorial,
    auxiliar:vAuxiliar,  aep:vAEP,     regimenes:vRegimenes,
    papeles:vPapeles,    precios:vPrecios, empresas:vEmpresas,
    admin:vAdmin,        onboarding:vOnboarding, nomina:vNomina
  };
  if(typeof checkAdminURL==='function'&&checkAdminURL()&&st.view!=='admin') st.view='admin';
  if(!planInfo&&typeof guardarPlan==='function'){
    guardarPlan({plan:'pro',maxEmpresas:5,expiry:'2099-12',
      clienteNombre:'Beta Gratuita',
      activadoEl:new Date().toISOString().slice(0,10)});
    planInfo=cargarPlan();
    if(!empresas||!empresas.length) initEmpresas();
  }
  var appEl=document.getElementById('app');
  if(!appEl) return;
  var viewFn=v[st.view]||vDashboard;
  try{
    appEl.innerHTML=header()+'<main>'+viewFn()+'<\/main>'+nav();
  }catch(e){
    console.error('Render error:',e);
    appEl.innerHTML='<div style="padding:20px;color:var(--red)">Error: '+e.message+'<\/div>';
  }
}

function goto(v){st.view=v;render();window.scrollTo(0,0);}
// Exponer render globalmente para handlers inline
window.render=render;
window.goto=goto;


// Inicializar app cuando el DOM esté listo
function initApp(){
  const sp=document.getElementById('splash');
  if(!sp){setTimeout(initApp,100);return;}
  sp.style.opacity='0';
  setTimeout(function(){
    sp.style.display='none';
    const appEl=document.getElementById('app');
    if(appEl)appEl.style.display='block';
    try{
      const activated=checkActivationURL();
      if(activated)toast('Plan activado correctamente');
      if(!planInfo){
        guardarPlan({plan:'pro',maxEmpresas:5,expiry:'2099-12',clienteNombre:'Beta Gratuita',activadoEl:new Date().toISOString().slice(0,10)});
        planInfo=cargarPlan();
      }
      initEmpresas();
      render();
    }catch(e){
      console.error('Init error:',e);
      document.getElementById('app').innerHTML='<div style="padding:20px;color:red">Error: '+e.message+'</div>';
    }
  },500);
}
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',function(){setTimeout(initApp,2200);});
}else{
  setTimeout(initApp,2200);
}
