[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# Cache headers para el HTML principal (sin cache para siempre ver la versión nueva)
[[headers]]
  for = "/ContaFlow.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Service Worker: sin cache para que se actualice
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

# PWA manifest
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

# Seguridad general
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
